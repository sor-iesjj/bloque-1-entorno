<text x="75" y="556" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#fff" font-weight="700">2</text>
<text x="122" y="557" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#233c48" font-weight="700">¿Cómo entras por SSH?</text>
<text x="74" y="599" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#536773">La conexión se queda dentro del ordenador físico.</text>
