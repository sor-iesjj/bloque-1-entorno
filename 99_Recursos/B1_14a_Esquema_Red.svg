<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc">
<title id="title">B1.14a: tu Windows administra un Ubuntu virtual</title>
<desc id="desc">Tres vistas del mismo laboratorio al terminar A. Un solo ordenador Windows contiene PowerShell y VirtualBox con una VM Ubuntu. El cliente SSH de Windows conecta a 127.0.0.1:2214; VirtualBox reenvía por el adaptador 1 NAT a OpenSSH de Ubuntu en TCP 22. La tarjeta 1 obtiene IP automática y sale a Internet mediante NAT y la conexión física de Windows. La tarjeta 2 tiene 10.10.10.10/24 sin puerta de enlace y conecta a LAB_RED. El cliente virtual se añadirá en B; aún no existe en A. Windows físico no pertenece a LAB_RED.</desc>
