<text x="815" y="705" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#217267" font-weight="700">OpenSSH · TCP 22</text>
<text x="815" y="747" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#536773">Acepta la conexión.</text>
<path d="M382 701H416" fill="none" stroke="#126484" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
