<text x="96" y="833" font-family="DejaVu Sans Mono,sans-serif" font-size="27" fill="#ffffff">ssh -p 2214 TU_USUARIO@127.0.0.1</text>
<text x="76" y="884" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#536773">127.0.0.1 = este Windows. No es una tercera tarjeta.</text>
