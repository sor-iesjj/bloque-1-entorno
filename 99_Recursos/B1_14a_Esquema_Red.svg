<text x="48" y="44" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#536773" font-weight="700">B1.14a · EL LABORATORIO, DE UN VISTAZO</text>
<text x="48" y="94" font-family="DejaVu Sans,sans-serif" font-size="39" fill="#233c48" font-weight="700">Tu Windows controla un Ubuntu virtual</text>
<text x="48" y="132" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#536773">Tres vistas del mismo montaje al terminar la práctica A.</text>
